# Servidor do jogo no Fly.io. Troque `app` pelo nome que você criar com `fly launch`.
app = "pergunta-oculta-server"
primary_region = "gru" # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  # CORS_ORIGIN fica nos segredos ou aqui: o endereço do front na Vercel
  # CORS_ORIGIN = "https://pergunta-oculta.vercel.app"

[http_service]
  internal_port = 3000
  force_https = true
  # As salas ficam em memória: a máquina não pode desligar sozinha nem ter cópias.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
